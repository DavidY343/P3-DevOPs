name: CI - Pruebas Automáticas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest  # Se ejecuta en un entorno Linux

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Usa la versión 3.10 de Python

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No hay requirements.txt, omitiendo instalación"

      - name: 🧪 Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: ✅ Reportar éxito
        if: success()
        run: echo "¡Todas las pruebas pasaron correctamente! 🚀"

      - name: ❌ Reportar fallo
        if: failure()
        run: echo "❌ Hubo fallos en las pruebas. Revisa el log arriba."
